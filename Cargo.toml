[workspace]
resolver = "2"
members = ["crates/orchestrator", "crates/api-client", "crates/factory", "crates/docker-provider", "crates/worker"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
