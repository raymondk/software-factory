# A pushed tag vX.Y.Z releases the factory: binaries per target on a GitHub release, and the worker image on ghcr.io.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$version" = "$cargo" ] || { echo "tag is v$version but Cargo.toml says $cargo" >&2; exit 1; }
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
  # 22.04 runners: glibc 2.35, so the binaries run on Debian bookworm (the worker image) and anything newer.
  build:
    needs: notes
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/orchestrator/ui/package-lock.json
      - run: npm ci
        working-directory: crates/orchestrator/ui
      - run: cargo build --release --locked -p orchestrator -p docker-provider -p factory -p worker
      - run: tar -czf software-factory-v${{ needs.notes.outputs.version }}-${{ matrix.target }}.tar.gz -C target/release orchestrator docker-provider factory worker
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"
  release:
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file artifacts/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  image:
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            mkdir -p "dist/linux/${pair#*:}"
            tar -xzf "artifacts/software-factory-v${{ needs.notes.outputs.version }}-${pair%:*}-unknown-linux-gnu.tar.gz" -C "dist/linux/${pair#*:}" worker factory
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:v${{ needs.notes.outputs.version }}
            ghcr.io/${{ github.repository }}/worker:latest
