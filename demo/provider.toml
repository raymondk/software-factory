[provider]
listen = "0.0.0.0:8081"
max_workers = 2

[agents.claude-code]
image = "software-factory/worker:latest"
models = ["sonnet", "opus"]
default_model = "sonnet"

# demo.sh fills these from the environment into a copy in a temp dir.
[worker_env]
GIT_TOKEN = "${GIT_TOKEN}"
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN}"
