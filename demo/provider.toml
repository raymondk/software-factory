[provider]
listen = "0.0.0.0:8081"
max_workers = 2
token = "demo-provider-token"

[agents.claude-code]
image = "software-factory/worker:latest"
models = ["sonnet", "opus"]
default_model = "sonnet"

# demo.sh writes GIT_TOKEN and CLAUDE_CODE_OAUTH_TOKEN from the environment into provider.secrets.toml beside its copy.
