<!doctype html>
<meta charset="utf-8">
<title>Software Factory</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; display: grid; grid-template-columns: 3fr minmax(16rem, 1fr); gap: 1.5rem; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 1.2rem; }
  #error { grid-column: 1 / -1; display: flex; gap: .5rem; padding: .4rem .6rem; background: #f8d7da; color: #842029; border-radius: 4px; }
  #error:empty { display: none; }
  #error button { margin-left: auto; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #ddd; }
  form { display: grid; gap: .5rem; margin-bottom: 1rem; }
  #create { display: flex; align-items: start; }
  #create input { flex: 1; }
  input, textarea, select { font: inherit; padding: .3rem; }
  pre { white-space: pre-wrap; }
  #board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5rem; }
  .column h3 { margin: 0 0 .5rem; padding: .3rem .5rem; font-size: .9rem; background: #eee; border-radius: 4px; }
  .column.failed h3 { background: #f8d7da; color: #842029; }
  .card { border: 1px solid #ddd; border-radius: 4px; padding: .4rem .5rem; margin-bottom: .5rem; cursor: pointer; overflow-wrap: anywhere; }
  .card:hover { background: #f4f4f4; }
  .meta { display: flex; gap: .4rem; align-items: center; margin-top: .3rem; color: #666; font-size: .85em; }
  .meta button { padding: 0 .3rem; margin-left: auto; }
  .meta button + button { margin-left: 0; }
  .badge { background: #d9534f; color: #fff; border-radius: 1em; padding: 0 .5em; }
  #detail:empty::before { content: "Select a ticket."; color: #888; }
  #workers-section, #metrics-section { grid-column: 1 / -1; }
  summary { cursor: pointer; font-weight: bold; margin-bottom: .5rem; }
  #workers tr[data-ticket] { cursor: pointer; }
  #workers tr[data-ticket]:hover { background: #f4f4f4; }
  .comment { border-top: 1px solid #ddd; border-left: 3px solid #ccc; padding: .5rem 0 .5rem .6rem; }
  .comment.human { border-left-color: #5b9bd5; }
  .comment small { color: #888; }
  .comment .tag { background: #eee; border-radius: 3px; padding: 0 .3em; }
  .comment.human .tag { background: #dbe9f6; }
  .comment.resolved { color: #999; text-decoration: line-through; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .body > * { margin: 0 0 .5rem; }
  .body code { background: #f4f4f4; padding: 0 .2em; }
  .body pre { background: #f4f4f4; padding: .4rem; }
  .notice { padding: .4rem .6rem; background: #fff3cd; color: #664d03; border-radius: 4px; }
  .notice button { margin-left: .5rem; }
  .body.collapsed { max-height: 12em; overflow: hidden; mask-image: linear-gradient(#000 60%, transparent); }
</style>
<h1>Software Factory</h1>
<div id="error"></div>
<section>
  <form id="create">
    <input name="title" placeholder="Title" required>
    <textarea name="description" placeholder="Description" rows="1"></textarea>
    <button>Create ticket</button>
  </form>
  <div id="board"><span id="loading">Loading…</span></div>
</section>
<section id="detail"></section>
<details id="workers-section" open>
  <summary>Workers</summary>
  <table>
    <thead><tr><th>Id</th><th>Type</th><th>Status</th><th>Last heartbeat</th><th>Ticket</th></tr></thead>
    <tbody id="workers"></tbody>
  </table>
</details>
<details id="metrics-section" open>
  <summary>Metrics</summary>
  <p id="totals"></p>
  <table>
    <thead><tr><th>Type</th><th>Tokens in</th><th>Tokens out</th><th>Cost</th><th>Completed</th><th>Failed</th></tr></thead>
    <tbody id="metrics"></tbody>
  </table>
</details>
<script>
  const TOKEN = __TOKEN__;
  const headers = { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" };
  const api = (path, opts) => fetch(path, { headers, ...opts }).then(async r => {
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    return r.json();
  });
  const el = (tag, text) => { const e = document.createElement(tag); if (text != null) e.textContent = text; return e; };
  const error = document.getElementById("error");
  const showError = (message, fromRefresh) => {
    const close = el("button", "×");
    close.onclick = () => error.replaceChildren();
    error.replaceChildren(el("span", message), close);
    error.classList.toggle("refresh", !!fromRefresh);
  };
  // Disables the clicked/submitting button while the handler runs; errors go to the bar.
  const busy = fn => async e => {
    const b = e.submitter ?? e.currentTarget;
    b.disabled = true;
    try { await fn(e); } catch (err) { showError(err.message); } finally { b.disabled = false; }
  };
  const ago = iso => {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    if (s < 172800) return "yesterday";
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  };
  // Minimal markdown: escape first, then fenced code, paragraphs, lists, inline code, http(s) links.
  const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  const inline = s => {
    const codes = [];
    return s.replace(/`([^`\n]+)`/g, (_, c) => `\0${codes.push(`<code>${c}</code>`) - 1}\0`)
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|https?:\/\/[^\s<]+?(?=[.,;:!?)]*(?:\s|$))/g,
               (m, text, href) => link(href ?? m, text ?? m))
      .replace(/\0(\d+)\0/g, (_, i) => codes[i]);
  };
  const markdown = src => esc(src).split(/^```[^\n]*\n([\s\S]*?)\n?^```[ \t]*$/m).map((part, i) =>
    i % 2 ? `<pre><code>${part}</code></pre>` : part.split(/\n[ \t]*\n/).map(b => b.trim()).filter(Boolean).map(block => {
      const lines = block.split("\n");
      if (lines.every(l => /^\s*[-*] /.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
      return `<p>${inline(block)}</p>`;
    }).join("")).join("");
  const STATES = ["todo", "ready", "in_progress", "in_review", "failed", "done"];
  const stateSelect = (select, value) => {
    for (const s of STATES) { const o = el("option", s); o.value = s; o.selected = s === value; select.append(o); }
    return select;
  };

  async function list() {
    const tickets = await api("/tickets");
    document.getElementById("board").replaceChildren(...STATES.map(s => {
      const col = el("section");
      col.className = "column " + s;
      const cards = tickets.filter(t => t.state === s);
      col.append(el("h3", `${s} (${cards.length})`));
      cards.forEach((t, i) => col.append(card(t, cards[i - 1], cards[i + 1])));
      return col;
    }));
  }

  function card(t, prev, next) {
    const c = el("div");
    c.className = "card";
    const meta = el("div");
    meta.className = "meta";
    if (t.assignee) meta.append(el("span", t.assignee));
    if (t.unresolved_comments) {
      const b = el("span", t.unresolved_comments);
      b.className = "badge";
      b.title = "unresolved comments";
      meta.append(b);
    }
    meta.append(moveButton("↑", prev && { before: prev.id }, t.id),
                moveButton("↓", next && { after: next.id }, t.id));
    c.append(el("div", `#${t.id} ${t.title}`), meta);
    c.onclick = () => show(t.id).catch(e => showError(e.message));
    return c;
  }

  async function listWorkers() {
    const tbody = document.getElementById("workers");
    tbody.replaceChildren();
    for (const w of await api("/workers")) {
      const tr = el("tr");
      for (const v of [w.id, w.worker_type, w.status, w.last_heartbeat ?? "", w.ticket ? "#" + w.ticket : ""]) tr.append(el("td", v));
      if (w.ticket) { tr.dataset.ticket = w.ticket; tr.onclick = () => show(w.ticket).catch(e => showError(e.message)); }
      tbody.append(tr);
    }
  }

  const usageLine = u => `tokens in: ${u.tokens_in} · tokens out: ${u.tokens_out} · cost: $${u.cost.toFixed(2)}`;

  async function listMetrics() {
    const m = await api("/metrics");
    document.getElementById("totals").textContent =
      `${usageLine(m.totals)} · completed: ${m.totals.tickets_completed} · failed: ${m.totals.tickets_failed}`;
    document.getElementById("metrics").replaceChildren(...m.per_worker_type.map(w => {
      const tr = el("tr");
      for (const v of [w.worker_type, w.tokens_in, w.tokens_out, "$" + w.cost.toFixed(2), w.tickets_completed, w.tickets_failed]) tr.append(el("td", v));
      return tr;
    }));
    return m;
  }

  function moveButton(label, body, id) {
    const b = el("button", label);
    b.disabled = !body;
    b.onclick = busy(async e => {
      e.stopPropagation();
      await api("/tickets/" + id + "/move", { method: "POST", body: JSON.stringify(body) });
      await list();
    });
    return b;
  }

  let selected = null, pane = null; // the open ticket id and its pane (rebuilt only when another ticket is opened)

  async function show(id) {
    selected = id;
    const [t, m] = await Promise.all([api("/tickets/" + id), listMetrics()]);
    if (selected !== id) return;
    const u = m.per_ticket.find(x => x.ticket_id === id) ?? { tokens_in: 0, tokens_out: 0, cost: 0 };
    if (pane?.id !== id) pane = buildPane(id);
    pane.update(t, u);
  }

  const FIELDS = ["title", "state", "description", "links"];

  // Builds the detail pane once; update() refreshes the read-only parts in place and never touches text the user typed.
  function buildPane(id) {
    const header = el("h2"), meta = el("p"), dates = el("p"), usage = el("p"), thread = el("section");
    const form = el("form");
    const notice = el("div", "Ticket changed on the server. ");
    notice.className = "notice";
    const reload = Object.assign(el("button", "Reload"), { type: "button" });
    notice.append(reload);
    form.append(notice, Object.assign(el("input"), { name: "title", required: true }),
                stateSelect(Object.assign(el("select"), { name: "state" })),
                Object.assign(el("textarea"), { name: "description", rows: 6 }),
                Object.assign(el("textarea"), { name: "links", rows: 3, placeholder: "Links, one per line" }),
                el("button", "Save"));
    let loaded, server, comments; // loaded: values the form was last filled with; server: latest from the server
    const values = () => Object.fromEntries(FIELDS.map(k => [k, form[k].value]));
    const same = (a, b) => FIELDS.every(k => a[k] === b[k]);
    const fill = v => { loaded = v; for (const k of FIELDS) form[k].value = v[k]; };
    reload.onclick = () => { fill(server); notice.hidden = true; };
    form.onsubmit = busy(async e => {
      e.preventDefault();
      const body = { ...values(), links: form.links.value.split("\n").map(l => l.trim()).filter(Boolean) };
      await api("/tickets/" + id, { method: "PATCH", body: JSON.stringify(body) });
      await list();
      await show(id);
    });
    const commentForm = el("form");
    const body = Object.assign(el("textarea"), { name: "body", rows: 3, placeholder: "Comment", required: true });
    commentForm.append(body, el("button", "Comment"));
    commentForm.onsubmit = busy(async e => {
      e.preventDefault();
      await api("/tickets/" + id + "/comments", { method: "POST", body: JSON.stringify({ body: body.value }) });
      body.value = "";
      await list();
      await show(id);
    });
    document.getElementById("detail").replaceChildren(header, meta, dates, usage, form, el("h3", "Comments"), thread, commentForm);
    const update = (t, u) => {
      header.textContent = `#${t.id} ${t.title}`;
      meta.textContent = `rank: ${t.rank} · assignee: ${t.assignee ?? "none"}`;
      dates.textContent = `created: ${t.created_at} · updated: ${t.updated_at}`;
      usage.textContent = usageLine(u);
      server = { title: t.title, state: t.state, description: t.description, links: t.links.join("\n") };
      if (!loaded || same(values(), loaded) || same(values(), server)) fill(server); // an untouched (or already matching) form follows the server silently
      notice.hidden = same(server, loaded);
      const json = JSON.stringify(t.comments);
      if (json !== comments) { comments = json; renderThread(thread, t); }
    };
    return { id, update };
  }

  function renderThread(thread, t) {
    thread.replaceChildren();
    for (const c of t.comments) {
      const div = el("div");
      const kind = c.author === "human" ? "human" : "worker";
      div.className = `comment ${kind}` + (c.resolved ? " resolved" : "");
      div.hidden = c.resolved;
      const tag = el("span", kind);
      tag.className = "tag";
      const time = el("span", ago(c.created_at));
      time.title = c.created_at;
      const meta = el("small");
      meta.append(kind === "worker" ? c.author + " " : "", tag, " · ", time, " ");
      if (!c.resolved) {
        const resolve = el("button", "Resolve");
        resolve.onclick = busy(async () => {
          await api(`/tickets/${t.id}/comments/${c.id}/resolve`, { method: "POST" });
          await list();
          await show(t.id);
        });
        meta.append(resolve);
      }
      const body = el("div");
      body.className = "body";
      body.innerHTML = markdown(c.body);
      div.append(meta, body);
      if (c.body.length > 600 || c.body.split("\n").length > 12) {
        body.classList.add("collapsed");
        const more = el("button", "Show more");
        more.onclick = () => { more.textContent = body.classList.toggle("collapsed") ? "Show more" : "Show less"; };
        div.append(more);
      }
      thread.append(div);
    }
    const resolved = t.comments.filter(c => c.resolved).length;
    if (resolved) {
      const toggle = el("button", `Show ${resolved} resolved`);
      toggle.onclick = () => {
        const shown = toggle.textContent.startsWith("Show");
        for (const r of thread.querySelectorAll(".resolved")) r.hidden = !shown;
        toggle.textContent = `${shown ? "Hide" : "Show"} ${resolved} resolved`;
      };
      thread.append(toggle);
    }
  }

  document.getElementById("create").onsubmit = busy(async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const t = await api("/tickets", { method: "POST", body: JSON.stringify({ title: f.get("title"), description: f.get("description") }) });
    e.target.reset();
    await list();
    await show(t.id);
  });

  const refresh = () => Promise.all([list(), listWorkers(), selected == null ? listMetrics() : show(selected)]);
  refresh().catch(e => showError(e.message)).finally(() => document.getElementById("loading")?.remove());
  // Polls while the tab is visible and refreshes as soon as it becomes visible again.
  // A refresh error is shown once (replaced, not stacked) and cleared by the next successful refresh.
  const tick = () => document.hidden || refresh().then(() => error.classList.contains("refresh") && error.replaceChildren(),
                                                       e => showError(e.message, true));
  setInterval(tick, 3000);
  document.addEventListener("visibilitychange", tick);
</script>
