<!doctype html>
<meta charset="utf-8">
<title>Software Factory</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 1.2rem; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #ddd; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f4f4f4; }
  tbody td:first-child { white-space: nowrap; padding: 0; }
  form { display: grid; gap: .5rem; margin-bottom: 1rem; }
  input, textarea, select { font: inherit; padding: .3rem; }
  #filter { margin-bottom: .5rem; }
  pre { white-space: pre-wrap; }
  #detail:empty::before { content: "Select a ticket."; color: #888; }
  #workers-section { grid-column: 1 / -1; }
  #workers tr { cursor: default; }
  .comment { border-top: 1px solid #ddd; padding: .5rem 0; }
  .comment small { color: #888; }
  .comment.resolved { color: #999; text-decoration: line-through; }
</style>
<h1>Software Factory</h1>
<section>
  <form id="create">
    <input name="title" placeholder="Title" required>
    <textarea name="description" placeholder="Description" rows="3"></textarea>
    <button>Create ticket</button>
  </form>
  <label id="filter">State <select id="state-filter"><option value="">all</option></select></label>
  <table>
    <thead><tr><th></th><th>#</th><th>Title</th><th>State</th><th>Rank</th><th>Assignee</th></tr></thead>
    <tbody id="tickets"></tbody>
  </table>
</section>
<section id="detail"></section>
<section id="workers-section">
  <h3>Workers</h3>
  <table>
    <thead><tr><th>Id</th><th>Type</th><th>Status</th><th>Last heartbeat</th><th>Ticket</th></tr></thead>
    <tbody id="workers"></tbody>
  </table>
</section>
<script>
  const TOKEN = __TOKEN__;
  const headers = { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" };
  const api = (path, opts) => fetch(path, { headers, ...opts }).then(async r => {
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    return r.json();
  });
  const el = (tag, text) => { const e = document.createElement(tag); if (text != null) e.textContent = text; return e; };
  const STATES = ["todo", "ready", "in_progress", "in_review", "failed", "done"];
  const stateSelect = (select, value) => {
    for (const s of STATES) { const o = el("option", s); o.value = s; o.selected = s === value; select.append(o); }
    return select;
  };

  async function list() {
    const tbody = document.getElementById("tickets");
    tbody.replaceChildren();
    const state = document.getElementById("state-filter").value;
    const tickets = await api("/tickets" + (state ? "?state=" + state : ""));
    tickets.forEach((t, i) => {
      const tr = el("tr");
      const arrows = el("td");
      arrows.append(moveButton("\u2191", tickets[i - 1] && { before: tickets[i - 1].id }, t.id),
                    moveButton("\u2193", tickets[i + 1] && { after: tickets[i + 1].id }, t.id));
      tr.append(arrows);
      for (const v of [t.id, t.title, t.state, t.rank, t.assignee ?? ""]) tr.append(el("td", v));
      tr.onclick = () => show(t.id);
      tbody.append(tr);
    });
  }

  async function listWorkers() {
    const tbody = document.getElementById("workers");
    tbody.replaceChildren();
    for (const w of await api("/workers")) {
      const tr = el("tr");
      for (const v of [w.id, w.worker_type, w.status, w.last_heartbeat ?? "", w.ticket ? "#" + w.ticket : ""]) tr.append(el("td", v));
      if (w.ticket) { tr.style.cursor = "pointer"; tr.onclick = () => show(w.ticket); }
      tbody.append(tr);
    }
  }

  function moveButton(label, body, id) {
    const b = el("button", label);
    b.disabled = !body;
    b.onclick = async e => {
      e.stopPropagation();
      await api("/tickets/" + id + "/move", { method: "POST", body: JSON.stringify(body) }).catch(e => alert(e.message));
      list();
    };
    return b;
  }

  async function show(id) {
    const t = await api("/tickets/" + id);
    const d = document.getElementById("detail");
    const form = el("form");
    const title = Object.assign(el("input"), { name: "title", value: t.title, required: true });
    const state = stateSelect(el("select"), t.state);
    const description = Object.assign(el("textarea"), { name: "description", value: t.description, rows: 6 });
    const links = Object.assign(el("textarea"), { name: "links", value: t.links.join("\n"), rows: 3, placeholder: "Links, one per line" });
    form.append(title, state, description, links, el("button", "Save"));
    form.onsubmit = async e => {
      e.preventDefault();
      const body = { title: title.value, state: state.value, description: description.value,
                     links: links.value.split("\n").map(l => l.trim()).filter(Boolean) };
      await api("/tickets/" + t.id, { method: "PATCH", body: JSON.stringify(body) }).catch(e => alert(e.message));
      await list();
      show(t.id);
    };
    const thread = el("section");
    for (const c of t.comments) {
      const div = el("div");
      div.className = "comment" + (c.resolved ? " resolved" : "");
      const meta = el("small", `${c.author} · ${c.created_at} `);
      if (!c.resolved) {
        const resolve = el("button", "Resolve");
        resolve.onclick = async () => {
          await api(`/tickets/${t.id}/comments/${c.id}/resolve`, { method: "POST" }).catch(e => alert(e.message));
          show(t.id);
        };
        meta.append(resolve);
      }
      div.append(meta, el("pre", c.body));
      thread.append(div);
    }
    const commentForm = el("form");
    const body = Object.assign(el("textarea"), { name: "body", rows: 3, placeholder: "Comment", required: true });
    commentForm.append(body, el("button", "Comment"));
    commentForm.onsubmit = async e => {
      e.preventDefault();
      await api("/tickets/" + t.id + "/comments", { method: "POST", body: JSON.stringify({ body: body.value }) }).catch(e => alert(e.message));
      show(t.id);
    };
    d.replaceChildren(
      el("h2", "#" + t.id + " " + t.title),
      el("p", `rank: ${t.rank} · assignee: ${t.assignee ?? "none"}`),
      el("p", `created: ${t.created_at} · updated: ${t.updated_at}`),
      form,
      el("h3", "Comments"),
      thread,
      commentForm,
    );
  }

  stateSelect(document.getElementById("state-filter")).onchange = () => list().catch(e => alert(e.message));

  document.getElementById("create").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const t = await api("/tickets", { method: "POST", body: JSON.stringify({ title: f.get("title"), description: f.get("description") }) });
    e.target.reset();
    await list();
    show(t.id);
  };

  list().then(listWorkers).catch(e => alert(e.message));
  setInterval(() => listWorkers().catch(() => {}), 5000);
</script>
