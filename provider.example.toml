[provider]
listen = "0.0.0.0:8081"
max_workers = 4
token = "change-me"   # the orchestrator sends this to start and stop workers

[agents.claude-code]
image = "ghcr.io/raymondk/software-factory/worker:latest"   # pin the release you run, e.g. :v0.1.0
# image = "ghcr.io/raymondk/software-factory/worker-icp:latest"   # same, plus Rust/wasm32, Motoko, mops and icp-cli for canister projects
models = ["sonnet", "opus"]
default_model = "sonnet"

# Secrets belong in provider.secrets.toml (gitignored), same layout; its values override this file's.
[worker_env]
GIT_TOKEN = "change-me"
CLAUDE_CODE_OAUTH_TOKEN = "change-me"
